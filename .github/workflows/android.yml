name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: keystore
        env:
          KEYSTORE_B64: ${{ secrets.GR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gr.jks"
            echo "GR_KEYSTORE=$RUNNER_TEMP/gr.jks" >> "$GITHUB_ENV"
          fi
      - name: build
        working-directory: android
        env:
          GR_KEYSTORE_PASS: ${{ secrets.GR_KEYSTORE_PASS }}
          GR_KEY_ALIAS: ${{ secrets.GR_KEY_ALIAS }}
          GR_KEY_PASS: ${{ secrets.GR_KEY_PASS }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ghostroom-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
